; ESP32 桌面陪伴机器人 - PlatformIO 配置
; 双环境：esp32dev = 经典 WROOM-32 蜂鸣器版 | esp32s3 = 小智AI语音版
; 编译: pio run -e esp32dev | 烧录: pio run -e esp32dev -t upload
; ⚠️ 不带 -e 会构建全部环境；esp32s3 首次构建需下载额外工具链(~130MB)

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    olikraus/U8g2
    madhephaestus/ESP32Servo

; ============ 小智AI 语音版（ESP32-S3-DevKitC-1，N8R8 推荐）============
; 首次构建：pio run -e esp32s3 （会下载 esp32s3 工具链）
; 烧录：按住 BOOT 插 USB → pio run -e esp32s3 -t upload
; 引脚映射见 src/config.h 的 ROBOT_IS_S3 区块；语音迁移路线见 docs/xiaozhi-migration.md
[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
lib_deps =
    olikraus/U8g2
    madhephaestus/ESP32Servo
