; ESP32 桌面陪伴机器人 - PlatformIO 配置
; 板子: ESP32 DevKit (ESP32-WROOM-32), 框架: Arduino
; 编译: pio run | 烧录: pio run -t upload | 串口: pio device monitor

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    olikraus/U8g2
    madhephaestus/ESP32Servo
