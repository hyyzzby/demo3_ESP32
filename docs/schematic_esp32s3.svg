<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Consolas,'Microsoft YaHei',monospace">
  <defs>
    <marker id="dot" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6">
      <circle cx="4" cy="4" r="3" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#f8fafc"/>
  <text x="700" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">demo3_ESP32 · ESP32-S3 语音版电路连接图 (v0.5)</text>
  <text x="700" y="68" text-anchor="middle" font-size="14" fill="#64748b">主控 ESP32-S3-DevKitC-1 · INMP441 麦克风 + MAX98357A 功放（小智AI 语音硬件底座）</text>

  <!-- ================= 主控板 ================= -->
  <rect x="590" y="150" width="220" height="720" rx="14" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="600" y="160" width="200" height="700" rx="10" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="700" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">ESP32-S3-DevKitC-1</text>
  <text x="700" y="203" text-anchor="middle" font-size="10" fill="#94a3b8">(WROOM-1 N8R8 含PSRAM)</text>

  <!-- 左侧引脚 -->
  <g font-size="11" fill="#fcd34d">
    <rect x="584" y="196" width="12" height="12" fill="#d4af37"/><text x="578" y="206" text-anchor="end">3V3</text>
    <rect x="584" y="296" width="12" height="12" fill="#d4af37"/><text x="578" y="306" text-anchor="end">GPIO4</text>
    <rect x="584" y="336" width="12" height="12" fill="#d4af37"/><text x="578" y="346" text-anchor="end">GPIO5</text>
    <rect x="584" y="376" width="12" height="12" fill="#d4af37"/><text x="578" y="386" text-anchor="end">GPIO6</text>
    <rect x="584" y="416" width="12" height="12" fill="#d4af37"/><text x="578" y="426" text-anchor="end">GPIO7</text>
    <rect x="584" y="466" width="12" height="12" fill="#d4af37"/><text x="578" y="476" text-anchor="end">GPIO8</text>
    <rect x="584" y="506" width="12" height="12" fill="#d4af37"/><text x="578" y="516" text-anchor="end">GPIO9</text>
    <rect x="584" y="556" width="12" height="12" fill="#d4af37"/><text x="578" y="566" text-anchor="end">GPIO2</text>
    <rect x="584" y="606" width="12" height="12" fill="#d4af37"/><text x="578" y="616" text-anchor="end">GPIO14</text>
  </g>
  <!-- 右侧引脚 -->
  <g font-size="11" fill="#fcd34d">
    <rect x="804" y="256" width="12" height="12" fill="#d4af37"/><text x="822" y="266">GPIO11</text>
    <rect x="804" y="296" width="12" height="12" fill="#d4af37"/><text x="822" y="306">GPIO12</text>
    <rect x="804" y="346" width="12" height="12" fill="#d4af37"/><text x="822" y="356">GPIO47</text>
    <rect x="804" y="396" width="12" height="12" fill="#d4af37"/><text x="822" y="406">5V</text>
    <rect x="804" y="441" width="12" height="12" fill="#d4af37"/><text x="822" y="451">GND</text>
  </g>
  <rect x="665" y="840" width="70" height="22" rx="11" fill="#475569"/>
  <text x="700" y="855" text-anchor="middle" font-size="10" fill="#e2e8f0">USB-C 供电/串口</text>

  <!-- ================= OLED (I2C 蓝色) ================= -->
  <rect x="90" y="170" width="240" height="160" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="210" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">0.96" OLED SSD1306</text>
  <text x="210" y="212" text-anchor="middle" font-size="10" fill="#64748b">I2C 地址 0x3C</text>
  <text x="105" y="234" font-size="11" fill="#2563eb">SCL ●</text><circle cx="330" cy="230" r="4" fill="#2563eb"/>
  <text x="105" y="274" font-size="11" fill="#2563eb">SDA ●</text><circle cx="330" cy="270" r="4" fill="#2563eb"/>
  <g font-size="10">
    <line x1="210" y1="170" x2="210" y2="152" stroke="#dc2626" stroke-width="2"/><text x="210" y="146" text-anchor="middle" fill="#dc2626">VCC→3V3</text>
    <line x1="210" y1="330" x2="210" y2="348" stroke="#0f172a" stroke-width="2"/><text x="210" y="362" text-anchor="middle" fill="#0f172a">GND</text>
  </g>

  <!-- I2C 走线 -->
  <polyline points="330,230 480,230 480,510 584,510" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <polyline points="330,270 450,270 450,470 584,470" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="500" y="500" font-size="10" fill="#2563eb">SCL</text>
  <text x="462" y="462" font-size="10" fill="#2563eb">SDA</text>

  <!-- ================= INMP441 (I2S 紫) ================= -->
  <rect x="90" y="400" width="240" height="210" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="210" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">INMP441 麦克风</text>
  <text x="210" y="442" text-anchor="middle" font-size="10" fill="#64748b">全向 MEMS · I2S RX (I2S0)</text>
  <text x="105" y="466" font-size="11" fill="#7c3aed">SCK ●</text><circle cx="330" cy="462" r="4" fill="#7c3aed"/>
  <text x="105" y="506" font-size="11" fill="#7c3aed">WS　●</text><circle cx="330" cy="502" r="4" fill="#7c3aed"/>
  <text x="105" y="546" font-size="11" fill="#7c3aed">SD　●</text><circle cx="330" cy="542" r="4" fill="#7c3aed"/>
  <g font-size="10">
    <line x1="210" y1="400" x2="210" y2="382" stroke="#dc2626" stroke-width="2"/><text x="210" y="376" text-anchor="middle" fill="#dc2626">VDD→3V3</text>
    <line x1="210" y1="610" x2="210" y2="628" stroke="#0f172a" stroke-width="2"/><text x="210" y="642" text-anchor="middle" fill="#0f172a">GND</text>
    <line x1="105" y1="590" x2="88" y2="590" stroke="#0f172a" stroke-width="2"/><text x="85" y="594" text-anchor="end" fill="#0f172a">L/R→GND</text>
  </g>

  <!-- I2S 麦克风走线 -->
  <polyline points="330,462 540,462 540,300 584,300" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <polyline points="330,502 560,502 560,340 584,340" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <polyline points="330,542 520,542 520,380 584,380" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="548" y="292" font-size="10" fill="#7c3aed">SCK</text>
  <text x="568" y="332" font-size="10" fill="#7c3aed">WS</text>
  <text x="528" y="372" font-size="10" fill="#7c3aed">SD</text>

  <!-- ================= 光敏分压 (ADC 绿) ================= -->
  <rect x="90" y="660" width="240" height="150" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="210" y="685" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">光敏 LDR 分压</text>
  <rect x="190" y="700" width="40" height="14" rx="4" fill="#059669"/>
  <text x="242" y="712" font-size="10" fill="#059669">LDR</text>
  <rect x="190" y="756" width="40" height="14" rx="4" fill="#94a3b8"/>
  <text x="242" y="768" font-size="10" fill="#475569">10KΩ</text>
  <line x1="210" y1="714" x2="210" y2="756" stroke="#475569" stroke-width="2"/>
  <circle cx="210" cy="735" r="5" fill="#059669"/>
  <line x1="210" y1="700" x2="210" y2="676" stroke="#dc2626" stroke-width="2"/><text x="196" y="690" font-size="10" fill="#dc2626" text-anchor="end">3V3</text>
  <line x1="210" y1="770" x2="210" y2="794" stroke="#0f172a" stroke-width="2"/><text x="196" y="788" font-size="10" fill="#0f172a" text-anchor="end">GND</text>
  <polyline points="215,735 420,735 420,560 584,560" fill="none" stroke="#059669" stroke-width="2.5"/>
  <text x="428" y="552" font-size="10" fill="#059669">GPIO2 (ADC1)</text>

  <!-- ================= 摸头触摸 (青) ================= -->
  <ellipse cx="170" cy="900" rx="80" ry="30" fill="#cffafe" stroke="#0891b2" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="170" y="905" text-anchor="middle" font-size="12" fill="#0e7490">锡箔纸/裸线（摸头区）</text>
  <polyline points="250,900 420,900 420,610 584,610" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="430" y="602" font-size="10" fill="#0891b2">GPIO14 (T14)</text>

  <!-- ================= MAX98357A (I2S 紫) ================= -->
  <rect x="1070" y="170" width="240" height="250" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="1190" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">MAX98357A 功放</text>
  <text x="1190" y="212" text-anchor="middle" font-size="10" fill="#64748b">I2S TX (I2S1) · 3W D类</text>
  <text x="1085" y="236" font-size="11" fill="#7c3aed">● BCLK</text><circle cx="1070" cy="232" r="4" fill="#7c3aed"/>
  <text x="1085" y="276" font-size="11" fill="#7c3aed">● LRC　</text><circle cx="1070" cy="272" r="4" fill="#7c3aed"/>
  <text x="1085" y="316" font-size="11" fill="#7c3aed">● DIN　</text><circle cx="1070" cy="312" r="4" fill="#7c3aed"/>
  <g font-size="10">
    <line x1="1190" y1="170" x2="1190" y2="152" stroke="#ea580c" stroke-width="2"/><text x="1190" y="146" text-anchor="middle" fill="#ea580c">VIN→5V</text>
    <line x1="1190" y1="420" x2="1190" y2="438" stroke="#0f172a" stroke-width="2"/><text x="1190" y="452" text-anchor="middle" fill="#0f172a">GND</text>
    <line x1="1310" y1="230" x2="1330" y2="230" stroke="#dc2626" stroke-width="2"/><text x="1334" y="234" fill="#dc2626">SD→3V3 (输出开)</text>
    <line x1="1310" y1="260" x2="1330" y2="260" stroke="#94a3b8" stroke-width="2"/><text x="1334" y="264" fill="#475569">GAIN 悬空=9dB</text>
    <circle cx="1340" cy="390" r="4" fill="#7c3aed"/><text x="1352" y="394" font-size="11" fill="#0f172a">OUT+</text>
    <circle cx="1340" cy="415" r="4" fill="#0f172a"/><text x="1352" y="419" font-size="11" fill="#0f172a">OUT−</text>
  </g>

  <!-- I2S 功放走线 -->
  <polyline points="810,232 1000,232 1000,232 1070,232" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <polyline points="810,272 1070,272" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <polyline points="810,312 1000,312 1000,312 1070,312" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="824" y="224" font-size="10" fill="#7c3aed">GPIO15 BCLK</text>
  <text x="940" y="264" font-size="10" fill="#7c3aed">GPIO16 LRC</text>
  <text x="824" y="304" font-size="10" fill="#7c3aed">GPIO7 DIN</text>

  <!-- 喇叭 -->
  <rect x="1140" y="480" width="120" height="100" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <circle cx="1200" cy="530" r="34" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <circle cx="1200" cy="530" r="12" fill="#94a3b8"/>
  <text x="1200" y="598" text-anchor="middle" font-size="11" fill="#0f172a">喇叭 8Ω 3W</text>
  <polyline points="1344,390 1380,390 1380,505 1262,505" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <polyline points="1344,415 1396,415 1396,555 1262,555" fill="none" stroke="#0f172a" stroke-width="2.5"/>

  <!-- ================= 舵机 ================= -->
  <rect x="1070" y="640" width="240" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1085" y="668" font-size="13" font-weight="bold" fill="#92400e">SG90 舵机 · 水平(pan)</text>
  <text x="1085" y="694" font-size="10" fill="#a16207">信号橙 · VCC红(外5V) · GND棕</text>
  <circle cx="1070" cy="675" r="4" fill="#d97706"/>
  <polyline points="810,260 950,260 950,675 1070,675" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <text x="824" y="252" font-size="10" fill="#d97706">GPIO11 信号</text>

  <rect x="1070" y="740" width="240" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1085" y="768" font-size="13" font-weight="bold" fill="#92400e">SG90 舵机 · 垂直(tilt)</text>
  <text x="1085" y="794" font-size="10" fill="#a16207">信号橙 · VCC红(外5V) · GND棕</text>
  <circle cx="1070" cy="775" r="4" fill="#d97706"/>
  <polyline points="810,300 980,300 980,775 1070,775" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <text x="824" y="292" font-size="10" fill="#d97706">GPIO12 信号</text>

  <!-- 供电说明 -->
  <rect x="1070" y="850" width="240" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="1190" y="875" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">供电要点 ⚡</text>
  <text x="1082" y="898" font-size="11" fill="#7f1d1d">· 舵机 VCC ← 外部 5V ≥2A</text>
  <text x="1082" y="918" font-size="11" fill="#7f1d1d">· 外部电源 GND 与开发板 GND 共地</text>
  <text x="1082" y="938" font-size="11" fill="#7f1d1d">· 板子本身 USB-C 供电即可</text>

  <!-- GPIO47 LED -->
  <rect x="620" y="700" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="724" text-anchor="middle" font-size="12" fill="#166534">状态 LED (可选)</text>
  <text x="700" y="744" text-anchor="middle" font-size="10" fill="#15803d">GPIO47 + 220Ω → LED → GND</text>
  <polyline points="810,352 900,352 900,700 780,700" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="824" y="344" font-size="10" fill="#16a34a">GPIO47</text>

  <!-- ================= 图例 ================= -->
  <rect x="60" y="580" width="220" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="608" font-size="13" font-weight="bold" fill="#0f172a">图例 Legend</text>
  <line x1="76" y1="632" x2="126" y2="632" stroke="#2563eb" stroke-width="3"/><text x="134" y="636" font-size="11" fill="#334155">I2C 总线 (OLED)</text>
  <line x1="76" y1="660" x2="126" y2="660" stroke="#7c3aed" stroke-width="3"/><text x="134" y="664" font-size="11" fill="#334155">I2S 音频 (麦/功放)</text>
  <line x1="76" y1="688" x2="126" y2="688" stroke="#d97706" stroke-width="3"/><text x="134" y="692" font-size="11" fill="#334155">舵机信号</text>
  <line x1="76" y1="716" x2="126" y2="716" stroke="#059669" stroke-width="3"/><text x="134" y="720" font-size="11" fill="#334155">ADC 模拟 (LDR)</text>
  <line x1="76" y1="744" x2="126" y2="744" stroke="#0891b2" stroke-width="3" stroke-dasharray="7,4"/><text x="134" y="748" font-size="11" fill="#334155">电容触摸</text>
  <line x1="76" y1="772" x2="126" y2="772" stroke="#dc2626" stroke-width="3"/><text x="134" y="776" font-size="11" fill="#334155">电源 3V3/5V</text>
  <line x1="76" y1="800" x2="126" y2="800" stroke="#0f172a" stroke-width="3"/><text x="134" y="804" font-size="11" fill="#334155">GND</text>
  <text x="76" y="836" font-size="10" fill="#64748b">所有 GND 必须共地</text>

  <text x="700" y="972" text-anchor="middle" font-size="11" fill="#94a3b8">接线定义与 src/config.h 的 ROBOT_IS_S3 区块一一对应 · demo3_ESP32 v0.5 · MIT License</text>
</svg>
